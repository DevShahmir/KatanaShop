<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Minimalist katana favicon - blade + tsuba -->
  <!-- Blade -->
  <path d="M16 2 L17.2 2.5 L17.8 22 L16 23 L14.2 22 L14.8 2.5 Z" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="0.4"/>
  <!-- Blade edge highlight -->
  <path d="M16 3 L16.8 3.3 L17.2 21.5 L16 22.3 Z" fill="#ffffff" opacity="0.6"/>
  <!-- Tsuba (guard) - elegant oval -->
  <ellipse cx="16" cy="23.5" rx="5" ry="1.8" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <ellipse cx="16" cy="23.5" rx="4.2" ry="1.3" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
  <!-- Red accent on tsuba -->
  <ellipse cx="16" cy="23.5" rx="3.2" ry="0.8" fill="none" stroke="#8b0000" stroke-width="0.6" opacity="0.9"/>
  <!-- Handle (tsuka) -->
  <rect x="15" y="25" width="2" height="5" rx="0.5" fill="#1a1a1a"/>
  <!-- Handle wrap pattern -->
  <line x1="15.2" y1="26" x2="16.8" y2="26.8" stroke="#2a2a2a" stroke-width="0.4"/>
  <line x1="15.2" y1="27.2" x2="16.8" y2="28" stroke="#2a2a2a" stroke-width="0.4"/>
  <line x1="15.2" y1="28.4" x2="16.8" y2="29.2" stroke="#2a2a2a" stroke-width="0.4"/>
  <!-- Pommel (kashira) -->
  <rect x="14.8" y="29.8" width="2.4" height="0.8" rx="0.4" fill="#1a1a1a"/>
</svg>